<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<rect width="1200" height="700" fill="#FAF6EF"/>
<text x="70" y="95" font-family="Helvetica, Arial, sans-serif" font-size="23" letter-spacing="5" fill="#8C2F39">THE PROMISE AND THE PRACTICE</text>
<text x="70" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="48" fill="#1A1A1A">What employers say, and what hiring shows</text>
<text x="70" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="120" fill="#8C2F39">85%</text>
<text x="70" y="340" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1A1A1A">of employers say they use skills-based hiring</text>
<text x="70" y="378" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5A544C">TestGorilla, State of Skills-Based Hiring 2025, April 2025 survey</text>
<line x1="70" y1="430" x2="1130" y2="430" stroke="#D8D2C4" stroke-width="1.5"/>
<text x="70" y="560" font-family="Georgia, 'Times New Roman', serif" font-size="120" fill="#8C2F39">1 in 700</text>
<text x="70" y="610" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1A1A1A">hires actually came from dropped degree requirements</text>
<text x="70" y="648" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5A544C">Harvard Business School and Burning Glass Institute, February 2024</text>
</svg>
