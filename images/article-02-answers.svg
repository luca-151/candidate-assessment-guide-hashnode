<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<rect width="1200" height="700" fill="#FAF6EF"/>
<text x="70" y="95" font-family="Helvetica, Arial, sans-serif" font-size="23" letter-spacing="5" fill="#8C2F39">THE QUESTION EVERY CANDIDATE ASKS</text>
<text x="70" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="50" fill="#1A1A1A">Is there a right answer?</text>
<text x="70" y="205" font-family="Georgia, 'Times New Roman', serif" font-size="35" fill="#1A1A1A">HireVue</text><text x="430" y="205" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1A1A1A">No answer key. Adaptive games, scored from the levels you reach.</text><line x1="70" y1="267" x2="1130" y2="267" stroke="#D8D2C4" stroke-width="1.5"/><text x="70" y="301" font-family="Georgia, 'Times New Roman', serif" font-size="35" fill="#1A1A1A">Arctic Shores</text><text x="430" y="301" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1A1A1A">No right or wrong answers. In-game points are not the evaluation.</text><line x1="70" y1="363" x2="1130" y2="363" stroke="#D8D2C4" stroke-width="1.5"/><text x="70" y="397" font-family="Georgia, 'Times New Roman', serif" font-size="35" fill="#1A1A1A">pymetrics</text><text x="430" y="397" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1A1A1A">No right or wrong ways of performing, per employer notices.</text><line x1="70" y1="459" x2="1130" y2="459" stroke="#D8D2C4" stroke-width="1.5"/><text x="70" y="493" font-family="Georgia, 'Times New Roman', serif" font-size="35" fill="#1A1A1A">Cappfinity</text><text x="430" y="493" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1A1A1A">Reasoning sections have right answers. Strengths questions do not.</text>
<text x="70" y="665" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#5A544C">Sources: vendor pages and employer notices, checked 26 November 2026.</text>
</svg>