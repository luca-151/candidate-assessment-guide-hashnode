<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<rect width="1200" height="700" fill="#FAF6EF"/>
<text x="70" y="95" font-family="Helvetica, Arial, sans-serif" font-size="23" letter-spacing="5" fill="#8C2F39">AT A GLANCE</text>
<text x="70" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="50" fill="#1A1A1A">The four assessments, side by side</text>
<text x="70" y="205" font-family="Georgia, 'Times New Roman', serif" font-size="35" fill="#1A1A1A">HireVue</text><text x="520" y="205" font-family="Georgia, 'Times New Roman', serif" font-size="29" fill="#8C2F39">15 to 25 min of games, plus video questions</text><text x="520" y="243" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#5A544C">Employer sees: a score band with a recommended next step</text><line x1="70" y1="267" x2="1130" y2="267" stroke="#D8D2C4" stroke-width="1.5"/><text x="70" y="301" font-family="Georgia, 'Times New Roman', serif" font-size="35" fill="#1A1A1A">Arctic Shores</text><text x="520" y="301" font-family="Georgia, 'Times New Roman', serif" font-size="29" fill="#8C2F39">About 30 min for 3 tasks, up to 9 tasks</text><text x="520" y="339" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#5A544C">Employer sees: a trait profile against a job-fit benchmark</text><line x1="70" y1="363" x2="1130" y2="363" stroke="#D8D2C4" stroke-width="1.5"/><text x="70" y="397" font-family="Georgia, 'Times New Roman', serif" font-size="35" fill="#1A1A1A">pymetrics (Harver)</text><text x="520" y="397" font-family="Georgia, 'Times New Roman', serif" font-size="29" fill="#8C2F39">About 25 min, 12 games</text><text x="520" y="435" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#5A544C">Employer sees: a fit recommendation, in tiers</text><line x1="70" y1="459" x2="1130" y2="459" stroke="#D8D2C4" stroke-width="1.5"/><text x="70" y="493" font-family="Georgia, 'Times New Roman', serif" font-size="35" fill="#1A1A1A">Cappfinity</text><text x="520" y="493" font-family="Georgia, 'Times New Roman', serif" font-size="29" fill="#8C2F39">Often 60 to 90 min, 12 question formats</text><text x="520" y="531" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#5A544C">Employer sees: a strengths profile and reasoning percentiles</text>
<text x="70" y="665" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#5A544C">Lengths as reported by the vendors and candidates, checked 26 November 2026. Employers choose the task mix.</text>
</svg>