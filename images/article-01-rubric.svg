<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="#FAF6EF"/>
<text x="70" y="95" font-family="Helvetica, Arial, sans-serif" font-size="23" letter-spacing="5" fill="#8C2F39">THE RUBRIC</text>
<text x="70" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="50" fill="#1A1A1A">How we scored: six criteria, same for every tool</text>
<text x="70" y="240" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#8C2F39">1</text><text x="125" y="240" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#1A1A1A">Formats covered</text><text x="125" y="276" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5A544C">How many of HireVue's game types the</text><text x="125" y="304" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5A544C">practice set includes</text><text x="615" y="240" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#8C2F39">2</text><text x="670" y="240" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#1A1A1A">Free tier</text><text x="670" y="276" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5A544C">What you can actually play before</text><text x="670" y="304" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5A544C">paying, not just read</text><text x="70" y="390" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#8C2F39">3</text><text x="125" y="390" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#1A1A1A">Price and billing model</text><text x="125" y="426" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5A544C">One-time pass, subscription or lifetime,</text><text x="125" y="454" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5A544C">and what happens when it ends</text><text x="615" y="390" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#8C2F39">4</text><text x="670" y="390" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#1A1A1A">Timing realism</text><text x="670" y="426" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5A544C">Whether practice runs against the clock,</text><text x="670" y="454" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5A544C">like the real assessment</text><text x="70" y="540" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#8C2F39">5</text><text x="125" y="540" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#1A1A1A">Feedback quality</text><text x="125" y="576" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5A544C">What you learn after a run: scores,</text><text x="125" y="604" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5A544C">history, what to fix</text><text x="615" y="540" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#8C2F39">6</text><text x="670" y="540" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#1A1A1A">Employer and platform coverage</text><text x="670" y="576" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5A544C">Whether it also helps when the next</text><text x="670" y="604" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5A544C">application uses a different provider</text>
<text x="70" y="680" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#5A544C">No tool pays for placement, and no tool is ranked first by default.</text>
</svg>