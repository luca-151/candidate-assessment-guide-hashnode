<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<rect width="1200" height="700" fill="#FAF6EF"/>
<text x="70" y="95" font-family="Helvetica, Arial, sans-serif" font-size="23" letter-spacing="5" fill="#8C2F39">SCALE AND SCRUTINY</text>
<text x="70" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#1A1A1A">Big numbers, harder questions</text>
<text x="70" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="110" fill="#8C2F39">1,500+</text>
<text x="70" y="352" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1A1A1A">employer partners, company figure reported January 2026</text>
<text x="70" y="390" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5A544C">Later 2026 reporting put the number trained at around 30,000 apprentices.</text>
<line x1="70" y1="440" x2="1130" y2="440" stroke="#D8D2C4" stroke-width="1.5"/>
<text x="70" y="585" font-family="Georgia, 'Times New Roman', serif" font-size="110" fill="#1A1A1A">52.6%</text>
<text x="560" y="585" font-family="Georgia, 'Times New Roman', serif" font-size="110" fill="#8A8378">65.4%</text>
<text x="70" y="632" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1A1A1A">Multiverse completion rate</text>
<text x="560" y="632" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1A1A1A">Sector average</text>
<text x="70" y="668" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#5A544C">Source: Department for Education figures, as reported in 2026. Ofsted also noted just under half of 2024/25 starters left early.</text>
</svg>
