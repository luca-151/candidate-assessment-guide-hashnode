<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<rect width="1200" height="700" fill="#FAF6EF"/>
<text x="70" y="95" font-family="Helvetica, Arial, sans-serif" font-size="23" letter-spacing="5" fill="#8C2F39">AT A GLANCE</text>
<text x="70" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="50" fill="#1A1A1A">The four platforms, side by side</text>
<text x="70" y="205" font-family="Georgia, 'Times New Roman', serif" font-size="35" fill="#1A1A1A">HireVue</text><text x="430" y="205" font-family="Georgia, 'Times New Roman', serif" font-size="29" fill="#8C2F39">Think time: 0 to 5 min, vendor recommends 60 sec</text><text x="430" y="243" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#5A544C">Retakes: employer on/off, 1 to 2 recommended</text><line x1="70" y1="267" x2="1130" y2="267" stroke="#D8D2C4" stroke-width="1.5"/><text x="70" y="301" font-family="Georgia, 'Times New Roman', serif" font-size="35" fill="#1A1A1A">Spark Hire</text><text x="430" y="301" font-family="Georgia, 'Times New Roman', serif" font-size="29" fill="#8C2F39">Think time: 30 sec to 5 min, or unlimited</text><text x="430" y="339" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#5A544C">Retakes: 1 to 5 takes, or unlimited</text><line x1="70" y1="363" x2="1130" y2="363" stroke="#D8D2C4" stroke-width="1.5"/><text x="70" y="397" font-family="Georgia, 'Times New Roman', serif" font-size="35" fill="#1A1A1A">Talview</text><text x="430" y="397" font-family="Georgia, 'Times New Roman', serif" font-size="29" fill="#8C2F39">Think time: set by the recruiter</text><text x="430" y="435" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#5A544C">Retakes: as defined by the recruiter; Ivy AI is single-attempt</text><line x1="70" y1="459" x2="1130" y2="459" stroke="#D8D2C4" stroke-width="1.5"/><text x="70" y="493" font-family="Georgia, 'Times New Roman', serif" font-size="35" fill="#1A1A1A">VidCruiter</text><text x="430" y="493" font-family="Georgia, 'Times New Roman', serif" font-size="29" fill="#8C2F39">Think time: 30 sec to 2 min is typical</text><text x="430" y="531" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#5A544C">Retakes: employer sets per question, commonly 0 to 2</text>
<text x="70" y="665" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#5A544C">Think time and retakes are set by the employer in most cases, checked 26 November 2026.</text>
</svg>