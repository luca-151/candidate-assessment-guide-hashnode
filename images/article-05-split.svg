<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<rect width="1200" height="700" fill="#FAF6EF"/>
<text x="70" y="95" font-family="Helvetica, Arial, sans-serif" font-size="23" letter-spacing="5" fill="#8C2F39">A MARKET SPLIT IN TWO</text>
<text x="70" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="48" fill="#1A1A1A">Graduate hiring by employer, UK 2025/26</text>
<text x="70" y="245" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#1A1A1A">Increased hiring</text>
<rect x="70" y="265" width="450" height="46" fill="#8C2F39"/>
<text x="540" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#8C2F39">45%</text>
<text x="70" y="415" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#1A1A1A">Held hiring level</text>
<rect x="70" y="435" width="150" height="46" fill="#C9A227"/>
<text x="240" y="470" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#8C2F39">15%</text>
<text x="70" y="585" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#1A1A1A">Cut hiring</text>
<rect x="70" y="605" width="400" height="46" fill="#8A8378"/>
<text x="490" y="640" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#8C2F39">40%</text>
<text x="70" y="680" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#5A544C">Overall hiring rose 4%, but the growth came from a few large employers. Source: ISE Student Recruitment Survey 2026.</text>
</svg>
